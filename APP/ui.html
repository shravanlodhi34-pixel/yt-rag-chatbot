<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI RAG Chatbot</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121932;
      --panel-2: #192244;
      --border: #28345e;
      --text: #e8ecf8;
      --muted: #9aa7cc;
      --accent: #6c8cff;
      --accent-hover: #839eff;
      --user-bg: #2a3b7a;
      --bot-bg: #151e3b;
      --success: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.14);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.35);
    }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, input[type="password"] {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
    }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 310px 1fr;
      min-height: 0;
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .card h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
    .stat-row { display: flex; justify-content: space-between; font-size: 0.86rem; padding: 3px 0; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; color: var(--text); margin-top: 6px; }
    .btn-secondary:hover { background: rgba(255,255,255,0.06); }
    .chunk-list { display: flex; flex-direction: column; gap: 8px; }
    .chunk-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--muted);
    }
    .chunk-item strong { color: var(--accent); display: block; margin-bottom: 4px; }
    main {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 780px;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.94rem;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: var(--user-bg); border: 1px solid #3c54a8; }
    .msg.bot { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); }
    .sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .source-pill {
      display: inline-block;
      margin: 4px 6px 0 0;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text);
    }
    .source-detail {
      margin-top: 6px;
      padding: 8px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      display: none;
    }
    .prompts {
      padding: 0 20px 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    form.composer {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    form.composer input {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.94rem;
      outline: none;
    }
    form.composer button { width: auto; padding: 0 20px; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      aside { max-height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>AI RAG Chatbot</span>
      <span class="badge" id="statusBadge">Ready</span>
    </div>
    <div class="controls">
      <select id="providerSelect" title="LLM Mode">
        <option value="auto">Auto (Env Key or Local RAG)</option>
        <option value="local">Local Extractive RAG (No Key)</option>
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="groq">Groq</option>
      </select>
      <input type="password" id="apiKeyInput" placeholder="Optional API Key" style="display:none;" />
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="card">
        <h3>Knowledge Document</h3>
        <div class="stat-row"><span>File</span><strong id="docName">Loading...</strong></div>
        <div class="stat-row"><span>Characters</span><span id="docChars">-</span></div>
        <div class="stat-row"><span>Chunks</span><span id="docChunks">-</span></div>
        <div style="margin-top: 10px;">
          <input type="file" id="pdfUpload" accept="application/pdf" style="display:none;" />
          <button class="btn" id="uploadBtn" type="button">Upload Custom PDF</button>
          <button class="btn btn-secondary" id="resetBtn" type="button" style="display:none;">Reset to Sample PDF</button>
        </div>
      </div>

      <div class="card" style="flex:1; min-height: 150px; overflow-y: auto;">
        <h3>Extracted Chunks</h3>
        <div class="chunk-list" id="chunkList"></div>
      </div>
    </aside>

    <main>
      <div class="messages" id="messages">
        <div class="msg bot">Namaste! Main aapka AI RAG Chatbot hoon. Document load ho raha hai — aap is PDF ke baare mein koi bhi sawal pooch sakte hain ya apna khud ka PDF upload kar sakte hain.</div>
      </div>

      <div class="prompts">
        <button class="chip" type="button">What is Artificial Intelligence?</button>
        <button class="chip" type="button">What does Unit 2 say about Machine Learning?</button>
        <button class="chip" type="button">Summarize the key topics in this document</button>
      </div>

      <form class="composer" id="chatForm">
        <input type="text" id="questionInput" placeholder="PDF se kuch bhi poochein..." autocomplete="off" required />
        <button class="btn" type="submit" id="sendBtn">Send</button>
      </form>
    </main>
  </div>

  <script>
    let customChunks = null;

    const docNameEl = document.getElementById("docName");
    const docCharsEl = document.getElementById("docChars");
    const docChunksEl = document.getElementById("docChunks");
    const chunkListEl = document.getElementById("chunkList");
    const messagesEl = document.getElementById("messages");
    const providerSelect = document.getElementById("providerSelect");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const resetBtn = document.getElementById("resetBtn");
    const statusBadge = document.getElementById("statusBadge");

    providerSelect.addEventListener("change", () => {
      const showKey = ["gemini", "openai", "groq"].includes(providerSelect.value);
      apiKeyInput.style.display = showKey ? "inline-block" : "none";
    });

    function renderDocInfo(info) {
      docNameEl.textContent = info.filename;
      docCharsEl.textContent = info.total_characters;
      docChunksEl.textContent = info.total_chunks;
      chunkListEl.innerHTML = "";
      info.chunks.forEach((text, i) => {
        const div = document.createElement("div");
        div.className = "chunk-item";
        div.innerHTML = `<strong>Chunk ${i + 1}</strong>`;
        div.appendChild(document.createTextNode(text));
        chunkListEl.appendChild(div);
      });
    }

    async function loadDefaultDoc() {
      const res = await fetch("/api/chunks");
      const data = await res.json();
      customChunks = null;
      resetBtn.style.display = "none";
      renderDocInfo(data);
    }

    function appendMessage(role, text, sources = [], mode = "") {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;

      if (sources.length) {
        const srcBox = document.createElement("div");
        srcBox.className = "sources";
        srcBox.textContent = `Mode: ${mode || "local"} · Matched chunks: `;
        const detail = document.createElement("div");
        detail.className = "source-detail";

        sources.forEach((s) => {
          const pill = document.createElement("button");
          pill.type = "button";
          pill.className = "source-pill";
          pill.textContent = `Chunk #${s.index + 1} (${Math.round(s.score * 100)}%)`;
          pill.addEventListener("click", () => {
            detail.style.display = detail.style.display === "block" && detail.dataset.idx === String(s.index) ? "none" : "block";
            detail.dataset.idx = String(s.index);
            detail.textContent = s.text;
          });
          srcBox.appendChild(pill);
        });

        srcBox.appendChild(detail);
        div.appendChild(srcBox);
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function askQuestion(question) {
      appendMessage("user", question);
      const pending = appendMessage("bot", "Soch raha hoon...");
      statusBadge.textContent = "Thinking...";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            provider: providerSelect.value,
            api_key: apiKeyInput.value.trim() || null,
            chunks: customChunks,
          }),
        });
        const data = await res.json();
        pending.remove();
        if (!res.ok) {
          appendMessage("bot", `Error: ${data.detail || "Request failed"}`);
        } else {
          appendMessage("bot", data.answer, data.sources || [], data.mode || "local");
        }
      } catch (err) {
        pending.remove();
        appendMessage("bot", `Network error: ${err.message}`);
      } finally {
        statusBadge.textContent = "Ready";
      }
    }

    document.getElementById("chatForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("questionInput");
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      askQuestion(q);
    });

    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => askQuestion(btn.textContent));
    });

    document.getElementById("uploadBtn").addEventListener("click", () => {
      document.getElementById("pdfUpload").click();
    });

    document.getElementById("pdfUpload").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        alert("PDF size 4 MB se kam hona chahiye.");
        return;
      }
      statusBadge.textContent = "Parsing PDF...";
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      }
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, content_base64: btoa(binary) }),
      });
      const data = await res.json();
      statusBadge.textContent = "Ready";
      if (!res.ok) {
        alert(data.detail || "Upload failed");
        return;
      }
      customChunks = data.chunks;
      resetBtn.style.display = "inline-flex";
      renderDocInfo(data);
      appendMessage("bot", `"${data.filename}" upload aur split ho gaya (${data.total_chunks} chunks). Ab aap is naye PDF se sawal pooch sakte hain!`);
    });

    resetBtn.addEventListener("click", loadDefaultDoc);
    loadDefaultDoc();
  </script>
</body>
</html>
